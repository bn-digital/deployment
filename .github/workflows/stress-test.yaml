name: Stress Test Workflow

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  stress-test:
    runs-on: self-hosted

    steps:
      - name: Install stress-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y stress-ng

      - name: CPU and Memory Stress Test
        run: |
          stress-ng --cpu 4 --cpu-load 80 --timeout 300s &
          stress-ng --vm 2 --vm-bytes 90% --timeout 300s &
          wait

      - name: Disk I/O Stress Test
        run: |
          stress-ng --hdd 2 --hdd-bytes 2G --timeout 300s &
          wait

  build-test:
    runs-on: self-hosted

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y build-essential

      - name: Clone Linux Kernel (Large Codebase)
        run: git clone --depth=1 https://github.com/torvalds/linux.git

      - name: Compile Kernel (Heavy Compilation)
        run: |
          cd linux
          make defconfig
          make -j$(nproc) # Uses all available CPU cores

